<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Parent login | KinderRide Transit</title>
    <meta
      name="description"
      content="Sign in to your KinderRide parent account or create an account for your family."
    />
    <meta property="og:title" content="Parent login | KinderRide Transit" />
    <meta property="og:type" content="website" />
    <link
      rel="icon"
      href="../assets/images/brand/favicon.svg?v=schoolday-amber-1"
    />
    <link
      rel="canonical"
      href="https://teknritsolutions-2.github.io/School-Bus-Student-Transport-Service/pages/login.html"
    />
    <script>
      try {
        document.documentElement.dataset.theme =
          JSON.parse(localStorage.getItem("kinderride:wayfinder:v1:theme")) ||
          (matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        document.documentElement.dir =
          JSON.parse(localStorage.getItem("kinderride:wayfinder:v1:dir")) ||
          "ltr";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <link rel="stylesheet" href="../assets/css/fonts.css?v=schoolday-amber-1" />
    <link rel="stylesheet" href="../assets/css/style.css?v=schoolday-amber-1" />
    <link
      rel="stylesheet"
      href="../assets/css/dark-mode.css?v=schoolday-amber-1"
    />
    <link rel="stylesheet" href="../assets/css/rtl.css?v=schoolday-amber-1" />
    <link rel="stylesheet" href="../assets/css/auth.css?v=schoolday-amber-1" />
  </head>
  <body data-page="login" class="auth-body">
    <main id="main-content">
      <div class="auth-scene" aria-hidden="true">
        <img
          src="../assets/images/premium/login-interior.webp"
          width="1800"
          height="1200"
          alt=""
          fetchpriority="high"
        />
      </div>
      <div class="auth-wrap">
        <section class="auth-card">
          <a
            class="brand auth-brand"
            href="../index.html"
            aria-label="KinderRide Transit Home 1"
            ><span class="brand-symbol" aria-hidden="true"
              ><i></i><i></i><i></i></span
            ><span>KinderRide<small>TRANSIT</small></span></a
          ><span class="eyebrow">Parent account</span>
          <h1>Welcome back.</h1>
          <p data-auth-description>
            Your family’s transport information, thoughtfully connected.
          </p>
          <form data-auth-form>
            <div class="field">
              <label for="auth-email">Email address</label
              ><input
                id="auth-email"
                name="email"
                type="email"
                required
                autocomplete="email"
              />
            </div>
            <div class="field">
              <label for="auth-password">Password</label>
              <div class="password-control">
                <input
                  id="auth-password"
                  name="password"
                  type="password"
                  minlength="8"
                  required
                  autocomplete="current-password"
                /><button
                  type="button"
                  data-password-toggle
                  aria-label="Show password"
                >
                  Show
                </button>
              </div>
            </div>
            <div class="auth-options">
              <label
                ><input type="checkbox" name="remember" /> Remember me</label
              ><button type="button" class="plain-button" data-forgot>
                Forgot password?
              </button>
            </div>

            <button class="button auth-submit" type="submit">Sign In →</button>
            <p class="form-status" role="status" data-auth-status></p>
          </form>
          <div class="auth-divider"><span>or continue with</span></div>
          <div class="auth-providers">
            <button
              class="button secondary"
              data-provider="Google"
              type="button"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  fill="#4285F4"
                  d="M22 12.2c0-.7-.1-1.4-.2-2.2H12v4.1h5.6a4.8 4.8 0 0 1-2.1 3.1v2.6h3.4c2-1.8 3.1-4.4 3.1-7.6Z"
                />
                <path
                  fill="#34A853"
                  d="M12 22c2.8 0 5.2-.9 6.9-2.5l-3.4-2.6c-.9.6-2.1 1-3.5 1-2.7 0-5-1.8-5.8-4.3H2.7v2.7A10.4 10.4 0 0 0 12 22Z"
                />
                <path
                  fill="#FBBC05"
                  d="M6.2 13.6a6.2 6.2 0 0 1 0-3.2V7.7H2.7a10 10 0 0 0 0 8.6l3.5-2.7Z"
                />
                <path
                  fill="#EA4335"
                  d="M12 6.1c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 2.7 7.7l3.5 2.7C7 7.9 9.3 6.1 12 6.1Z"
                />
              </svg>
              Google</button
            ><button
              class="button secondary"
              data-provider="Apple"
              type="button"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M17 3c-2 0-4 2-4 4 2 0 4-2 4-4ZM16 8c-2 0-2 1-4 1s-2-1-4-1c-6 0-5 11-1 13 2 1 3-1 5-1s3 2 5 1c2-1 3-4 3-4-4-2-4-6-1-8-1-1-2-1-3-1Z"
                />
              </svg>
              Apple
            </button>
          </div>
          <p class="auth-switch">
            New to KinderRide? <a href="register.html">Create an account</a>
          </p>
        </section>
      </div>
    </main>

    <script
      type="module"
      src="../assets/js/main.js?v=schoolday-amber-1"
    ></script>
  </body>
</html>
