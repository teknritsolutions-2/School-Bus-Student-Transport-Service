<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Parent login | KinderRide Transit</title>
    <meta
      name="description"
      content="Standalone parent account interface with clearly unconnected authentication."
    />
    <meta property="og:title" content="Parent login | KinderRide Transit" />
    <meta property="og:type" content="website" />
    <link rel="icon" href="../assets/images/brand/favicon.svg?v=wayfinder-3" />
    <link
      rel="canonical"
      href="https://teknritsolutions-2.github.io/School-Bus-Student-Transport-Service/pages/login.html"
    />
    <script>
      try {
        document.documentElement.dataset.theme =
          JSON.parse(localStorage.getItem("kinderride:wayfinder:v1:theme")) ||
          (matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        document.documentElement.dir =
          JSON.parse(localStorage.getItem("kinderride:wayfinder:v1:dir")) ||
          "ltr";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <link rel="stylesheet" href="../assets/css/fonts.css?v=wayfinder-3" />
    <link rel="stylesheet" href="../assets/css/style.css?v=wayfinder-3" />
    <link rel="stylesheet" href="../assets/css/dark-mode.css?v=wayfinder-3" />
    <link rel="stylesheet" href="../assets/css/rtl.css?v=wayfinder-3" />
    <link rel="stylesheet" href="../assets/css/auth.css?v=wayfinder-3" />
  </head>
  <body data-page="login" class="auth-body">
    <main id="main-content">
      <div class="auth-wrap">
        <a
          class="brand auth-brand"
          href="../index.html"
          aria-label="KinderRide Transit Home 1"
          ><span class="brand-symbol" aria-hidden="true"
            ><i></i><i></i><i></i></span
          ><span>KinderRide<small>TRANSIT</small></span></a
        >
        <section class="auth-card">
          <span class="eyebrow">Parent account</span>
          <h1>Welcome back.</h1>
          <p>Your family’s transport information, thoughtfully connected.</p>
          <form data-auth-form>
            <div class="field">
              <label for="auth-email">Email address</label
              ><input
                id="auth-email"
                name="email"
                type="email"
                required
                autocomplete="email"
              />
            </div>
            <div class="field">
              <label for="auth-password">Password</label>
              <div class="password-control">
                <input
                  id="auth-password"
                  name="password"
                  type="password"
                  minlength="8"
                  required
                  autocomplete="current-password"
                /><button
                  type="button"
                  data-password-toggle
                  aria-label="Show password"
                >
                  Show
                </button>
              </div>
            </div>
            <div class="auth-options">
              <label
                ><input type="checkbox" name="remember" /> Remember me</label
              ><button type="button" class="plain-button" data-forgot>
                Forgot password?
              </button>
            </div>

            <button class="button auth-submit" type="submit">Sign In →</button>
            <p class="form-status" role="status" data-auth-status></p>
          </form>
          <div class="auth-divider"><span>or continue with</span></div>
          <div class="auth-providers">
            <button
              class="button secondary"
              data-provider="Google"
              type="button"
            >
              <b aria-hidden="true">G</b> Google</button
            ><button
              class="button secondary"
              data-provider="Apple"
              type="button"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M17 3c-2 0-4 2-4 4 2 0 4-2 4-4ZM16 8c-2 0-2 1-4 1s-2-1-4-1c-6 0-5 11-1 13 2 1 3-1 5-1s3 2 5 1c2-1 3-4 3-4-4-2-4-6-1-8-1-1-2-1-3-1Z"
                />
              </svg>
              Apple
            </button>
          </div>
          <p class="auth-switch">
            New to KinderRide? <a href="register.html">Create an account</a>
          </p>
          <small class="auth-boundary"
            >Account services are not connected. No sign-in or account creation
            is performed.</small
          >
        </section>
        <a class="text-link auth-dashboard" href="parent-dashboard.html"
          >Explore the Parent Dashboard ↗</a
        >
      </div>
    </main>

    <script type="module" src="../assets/js/main.js?v=wayfinder-3"></script>
  </body>
</html>
